name: keepalive
on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping
        env:
          API_URL: ${{ secrets.API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          res=$(curl -sS --max-time 30 -X POST "$API_URL" -H "Content-Type: application/json" -H "apikey: $API_KEY" -d '{"action":"ping"}')
          echo "$res"
          echo "$res" | grep -q '"result":"success"'
